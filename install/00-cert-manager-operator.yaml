# -----------------------------------------------------------------------------
# cert-manager Operator for Red Hat OpenShift
# -----------------------------------------------------------------------------
# The Red Hat build of Kueue Operator REQUIRES cert-manager to be present.
# Skip this file only if cert-manager is already installed on the cluster.
#
# Apply:  oc apply -f 00-cert-manager-operator.yaml
# Verify: oc get csv -n cert-manager-operator
#         (wait for the cert-manager CSV to reach "Succeeded")
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager-operator
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
spec:
  targetNamespaces:
    - cert-manager-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-cert-manager-operator
  namespace: cert-manager-operator
spec:
  channel: stable-v1
  name: openshift-cert-manager-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
