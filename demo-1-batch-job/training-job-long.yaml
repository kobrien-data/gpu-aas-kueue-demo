# -----------------------------------------------------------------------------
# DEMO 1 (long-running variant) — same Kueue-managed batch Job, but it runs for
# a fixed wall-clock DURATION so the team can watch the whole workflow live.
# -----------------------------------------------------------------------------
# Control the runtime with the DURATION_SECONDS env var below (default 600 = 10
# min). It keeps 1 GPU busy the entire time and logs a heartbeat every
# LOG_EVERY_SECONDS with elapsed time, % complete, step count, and loss — so
# `oc logs -f` shows continuous progress and `nvidia-smi` shows GPU utilization.
#
# Because it holds its GPU for the full duration, this is also the best job to
# demo QUEUEING with: start this one, then submit the Ray / PyTorch jobs and
# watch them sit Pending in `oc get workloads` until this one finishes.
#
# Submit:  oc create -f training-job-long.yaml
# Watch:   oc get workloads -n gpu-aas-demo -w      # admission
#          oc logs -f -n gpu-aas-demo job/sample-training-long   # progress
#          watch -n2 'oc exec -n gpu-aas-demo job/sample-training-long -- nvidia-smi'
# Rerun:   delete first (fixed name): oc delete job sample-training-long -n gpu-aas-demo
# -----------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: sample-training-long
  namespace: gpu-aas-demo
  labels:
    kueue.x-k8s.io/queue-name: gpu-local-queue
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 0
  # Safety cap so a wedged pod can't run forever. Keep this comfortably ABOVE
  # DURATION_SECONDS (here 10 min run + 5 min headroom = 900s). Bump both together.
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          env:
            - name: DURATION_SECONDS      # <-- change this to make the demo longer/shorter
              value: "600"                #     600 = 10 minutes
            - name: LOG_EVERY_SECONDS
              value: "15"
          command: ["python", "-c"]
          args:
            - |
              import os, time, torch
              dur = int(os.environ.get("DURATION_SECONDS", "600"))
              log_every = int(os.environ.get("LOG_EVERY_SECONDS", "15"))
              assert torch.cuda.is_available(), "No GPU visible to the pod!"
              dev = torch.device("cuda")
              print(f"Training on: {torch.cuda.get_device_name(0)}  target ~{dur}s", flush=True)
              # Sized to keep an L4 meaningfully busy without exhausting its 24GB.
              x = torch.randn(8192, 8192, device=dev)
              w = torch.randn(8192, 8192, device=dev, requires_grad=True)
              opt = torch.optim.SGD([w], lr=1e-5)
              start = time.time(); last = -1e9; step = 0
              while True:
                  elapsed = time.time() - start
                  if elapsed >= dur:
                      break
                  loss = (x @ w).pow(2).mean()
                  opt.zero_grad(); loss.backward(); opt.step()
                  torch.cuda.synchronize()
                  step += 1
                  if elapsed - last >= log_every:
                      last = elapsed
                      pct = 100.0 * elapsed / dur
                      print(f"[{elapsed:6.0f}s / {dur}s  {pct:5.1f}%]  step {step:6d}  loss {loss.item():.4f}", flush=True)
              print(f"Training complete: {step} steps in {int(time.time()-start)}s.", flush=True)
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
