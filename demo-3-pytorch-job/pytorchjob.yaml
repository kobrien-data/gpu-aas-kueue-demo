# -----------------------------------------------------------------------------
# DEMO 3 — a distributed PyTorchJob (Kubeflow Training Operator), queued by Kueue.
# -----------------------------------------------------------------------------
# PyTorchJob is created/managed by the Kubeflow Training Operator, NOT by the
# CodeFlare SDK. Kueue governs it exactly like the other workloads via the
# queue-name label. This is the correct current path on OpenShift AI for
# distributed PyTorch training.
#
# This job runs 1 master + 2 workers, each requesting 1 GPU -> 3 GPUs total,
# admitted all-or-nothing (gang) by Kueue. The training script is mounted from
# the ConfigMap below and launched by the operator's torch elastic env vars.
#
# Submit:  oc apply -f pytorchjob.yaml
# Watch:   oc get workloads -n gpu-aas-demo -w
#          oc get pytorchjob,pods -n gpu-aas-demo
# Logs:    oc logs -n gpu-aas-demo pytorch-distributed-demo-master-0
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: ddp-train-script
  namespace: gpu-aas-demo
data:
  train.py: |
    import os, torch, torch.distributed as dist
    import torch.nn as nn

    dist.init_process_group(backend="nccl")
    rank, world = dist.get_rank(), dist.get_world_size()
    torch.cuda.set_device(0)
    dev = torch.device("cuda")
    print(f"[rank {rank}/{world}] on {torch.cuda.get_device_name(0)}", flush=True)

    model = nn.Linear(1024, 1024).to(dev)
    model = nn.parallel.DistributedDataParallel(model)
    opt = torch.optim.SGD(model.parameters(), lr=1e-3)

    for step in range(100):
        x = torch.randn(256, 1024, device=dev)
        loss = model(x).pow(2).mean()
        opt.zero_grad(); loss.backward(); opt.step()
        if rank == 0 and step % 20 == 0:
            print(f"step {step:3d}  loss {loss.item():.4f}", flush=True)

    if rank == 0:
        print("Distributed training complete.", flush=True)
    dist.destroy_process_group()
---
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: pytorch-distributed-demo
  namespace: gpu-aas-demo
  labels:
    kueue.x-k8s.io/queue-name: gpu-local-queue   # <-- routes the job through Kueue
spec:
  runPolicy:
    suspend: true    # Kueue admits by flipping this to false
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
              command: ["torchrun", "--nproc_per_node=1", "/workspace/train.py"]
              volumeMounts:
                - { name: script, mountPath: /workspace }
              resources:
                requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: "1" }
                limits:   { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1" }
          volumes:
            - name: script
              configMap: { name: ddp-train-script }
    Worker:
      replicas: 2
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
              command: ["torchrun", "--nproc_per_node=1", "/workspace/train.py"]
              volumeMounts:
                - { name: script, mountPath: /workspace }
              resources:
                requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: "1" }
                limits:   { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1" }
          volumes:
            - name: script
              configMap: { name: ddp-train-script }
